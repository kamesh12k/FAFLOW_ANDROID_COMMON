          description: List of entity targets e.g. ['audit_logs', 'notifications',
            'backups', 'traffic_metrics', 'leaves', 'credits', 'staff_leaves', 'timetable_submissions']
        filter_type:
          type: string
          title: Filter Type
          description: '''older_than_days'', ''date_range'', or ''all_records'''
          default: older_than_days
        older_than_days:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Older Than Days
          description: Number of days threshold for 'older_than_days' filter
          default: 90
        start_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Date
          description: Start date (YYYY-MM-DD) for date_range
        end_date:
          anyOf:
          - type: string
          - type: 'null'
          title: End Date
          description: End date (YYYY-MM-DD) for date_range
        department_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Department Id
          description: Optional department isolation filter
        leave_status_filter:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Leave Status Filter
          description: Optional leave statuses e.g. ['approved', 'rejected', 'cancelled']
        create_backup_first:
          type: boolean
          title: Create Backup First
          description: Automatically take a snapshot backup before purging
          default: true
        confirmation_phrase:
          type: string
          title: Confirmation Phrase
          description: Safety confirmation phrase
          default: PURGE DATA
      type: object
      required:
      - targets
      title: SelectivePurgeExecuteRequest
