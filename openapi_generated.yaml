        backup_filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Backup Filename
        purged_at:
          type: string
          title: Purged At
        purged_by:
          type: string
          title: Purged By
        message:
          type: string
          title: Message
      type: object
      required:
      - success
