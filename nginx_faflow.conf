server {
    server_name faflowgovernence.online www.faflowgovernence.online;

    root /opt/faflow-android/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # Static Vite Assets
    location /assets/ {
        root /opt/faflow-android/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API Prefix
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Direct API route prefixes (for Android clients accessing without /api/)
    # If a browser requests HTML (direct URL or reload), rewrite to SPA index.html
    location ~ ^/(academic-calendar|admin|announcements|attendance|audit|auth|backup|biometrics|campus-operations|classes|credits|day-order-calendar|departments|docs|geofences|governance|health|intelligence|leaves|manager|notifications|openapi.json|operational-staff|policy|principal|redoc|rooms|staff|student-attendance|subjects|substitutions|system|teacher|teachers|timetable) {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA Frontend Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/faflowgovernence.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/faflowgovernence.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.faflowgovernence.online) {
        return 301 https://$host$request_uri;
    }

    if ($host = faflowgovernence.online) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name faflowgovernence.online www.faflowgovernence.online;
    return 404;
}
