<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAFLOW Experience Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #121829;
            --bg-card: rgba(26, 34, 56, 0.7);
            --border-card: rgba(255, 255, 255, 0.08);
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-indigo: #6366f1;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15), transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15), transparent 40%),
                        var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(20px);
            background: rgba(10, 14, 26, 0.85);
            border-bottom: 1px solid var(--border-card);
            padding: 18px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-badge {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            text-transform: uppercase;
        }
        .controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .search-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 10px 18px;
            color: white;
            font-size: 14px;
            width: 260px;
            outline: none;
            transition: all 0.2s;
        }
        .search-box:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            width: 320px;
        }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 24px 36px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-card);
            color: var(--text-secondary);
            padding: 9px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            transform: translateY(-2px);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
        }
        .tab-count {
            background: rgba(0, 0, 0, 0.25);
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 11px;
        }
        .gallery-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 36px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }
        .mobile-grid {
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), 0 0 20px rgba(99, 102, 241, 0.2);
        }
        .card-img-wrapper {
            width: 100%;
            height: 220px;
            background: #05070d;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .card.mobile-card .card-img-wrapper {
            height: 380px;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            transition: transform 0.4s ease;
        }
        .card.mobile-card .card-img {
            object-fit: contain;
            padding: 10px;
        }
        .card:hover .card-img {
            transform: scale(1.04);
        }
        .card-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card-group {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 13, 0.95);
            backdrop-filter: blur(25px);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 32px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lightbox-close:hover {
            background: rgba(239, 68, 68, 0.4);
            border-color: #ef4444;
            transform: rotate(90deg);
        }
        .lightbox-content {
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .lightbox-img {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(99, 102, 241, 0.3);
            border: 1px solid var(--border-card);
        }
        .lightbox-title {
            margin-top: 18px;
            font-size: 20px;
            font-weight: 600;
            color: white;
            text-align: center;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lightbox-nav:hover {
            background: rgba(59, 130, 246, 0.4);
            border-color: var(--accent-blue);
            transform: translateY(-50%) scale(1.1);
        }
        .lightbox-prev { left: 32px; }
        .lightbox-next { right: 32px; }
    </style>
</head>

    <main class="gallery-container">

        </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">

        <button class="lightbox-nav lightbox-next" onclick="navLightbox(1, event)">&#10095;</button>
        <div class="lightbox-content">
            <img src="" class="lightbox-img" id="lightboxImg">
        </div>
        <div class="lightbox-title" id="lightboxTitle"></div>
    </div>

e-9255-b6c1feff5448/screenshots/web/50_manager_directory.png", "category": "Web", "group": "Staff & Operations"}, {"name": "51_staff_dashboard.png", "title": "51 Staff Dashboard", "path": "file:///C:/Users/kames/.gemini/antigravity-ide/brain/f21d8419-137f-439e-9255-b6c1feff5448/screenshots/web/51_staff_dashboard.png", "category": "Web", "group": "Staff & Operations"}, {"name": "52_staff_leaves.png", "title": "52 Staff Leaves", "path": "file:///C:/Users/kames/.gemini/antigravity-ide/brain/f21d8419-137f-439e-9255-b6c1feff5448/screenshots/web/52_staff_leaves.png", "category": "Web", "group": "Staff & Operations"}];
        let activeTab = 'ALL';
        let searchQuery = '';
        let currentFiltered = [];
        let currentIndex = 0;

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            currentFiltered = allItems.filter(item => {
                const matchesTab = activeTab === 'ALL' || item.group === activeTab || (activeTab === 'Mobile' && item.category === 'Mobile');
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || item.group.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesTab && matchesSearch;
            });

            if (activeTab === 'Android Mobile') {
                grid.classList.add('mobile-grid');
            } else {
                grid.classList.remove('mobile-grid');
            }

            currentFiltered.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card' + (item.category === 'Mobile' ? ' mobile-card' : '');
                card.onclick = () => openLightbox(index);
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${item.path}" class="card-img" loading="lazy" alt="${item.title}">
                    </div>
                    <div class="card-info">
                        <div class="card-group">${item.group}</div>
                        <div class="card-title">${item.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(tab) || (tab === 'ALL' && btn.innerText.includes('All')));
            });
            renderGallery();
        }

        function filterItems() {
            searchQuery = document.getElementById('searchInput').value;
            renderGallery();
        }

        function openLightbox(index) {
            currentIndex = index;
            const item = currentFiltered[index];
            if (!item) return;
            document.getElementById('lightboxImg').src = item.path;
            document.getElementById('lightboxTitle').innerText = item.title + ' (' + item.group + ')';
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightboxDirect() {
            document.getElementById('lightbox').classList.remove('active');
        }

        function closeLightbox(e) {
            if (e.target.id === 'lightbox') {
                closeLightboxDirect();
            }
        }

        function navLightbox(direction, e) {
            if (e) e.stopPropagation();
            currentIndex = (currentIndex + direction + currentFiltered.length) % currentFiltered.length;
            openLightbox(currentIndex);
        }

        document.addEventListener('keydown', (e) => {
            const lb = document.getElementById('lightbox');
            if (lb.classList.contains('active')) {
                if (e.key === 'Escape') closeLightboxDirect();
                if (e.key === 'ArrowLeft') navLightbox(-1);
                if (e.key === 'ArrowRight') navLightbox(1);
            }}
        );

        renderGallery();
    </script>
